<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Atkinson Hyperlegible Next";
        src: url("../src/assets/fonts/AtkinsonHyperlegibleNext.woff2") format("woff2");
        font-weight: 200 800;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: linear-gradient(180deg, #363933 0%, #2b1b3b 100%);
        color: #f1f4ec;
        font-family: "Atkinson Hyperlegible Next", sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
      h1 { font-size: 112px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
      .bottom { display: flex; align-items: center; justify-content: space-between; }
      .tagline { font-size: 30px; color: #c3c9bb; }
      .pill { display: inline-flex; align-items: center; gap: 16px; height: 72px; padding: 0 30px 0 26px; border-radius: 999px; background: #2f332c; box-shadow: 0 12px 40px rgb(0 0 0 / 0.35); font-size: 28px; font-weight: 600; }
      .bars { display: flex; align-items: center; gap: 6px; height: 34px; }
      .bars i { width: 8px; border-radius: 4px; background: #f1f4ec; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 24 24"><rect x="2.25" y="7.7" width="4.5" height="8.6" rx="2.25" fill="#F1F4EC"/><rect x="9.75" y="3" width="4.5" height="18" rx="2.25" fill="#C7A2EC"/><rect x="17.25" y="7.7" width="4.5" height="8.6" rx="2.25" fill="#F1F4EC"/></svg>
      Tagara
    </div>
    <h1 data-text="title"></h1>
    <div class="bottom">
      <p class="tagline" data-text="tagline"></p>
      <span class="pill">
        <span class="bars"><i style="height: 45%"></i><i style="height: 100%; background: #c7a2ec"></i><i style="height: 65%"></i></span>
        <span data-text="pill"></span>
      </span>
    </div>
    <script>
      const texts = {
        pt: { title: 'Fala que eu escrevo.', tagline: 'Ditado por voz local para Mac · grátis', pill: 'ouvindo…' },
        en: { title: 'Speak. I’ll type.', tagline: 'Local voice dictation for Mac · free', pill: 'listening…' },
      };
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'pt';
      for (const el of document.querySelectorAll('[data-text]')) el.textContent = texts[lang][el.dataset.text];
    </script>
  </body>
</html>
