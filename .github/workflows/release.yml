name: CI / Release

# Every push to main that changes the app runs the tests, builds Tagara.dmg and publishes it as a
# GitHub Release (v<VERSION>.<run number>). Site and docs changes are ignored. Pull requests only
# test and build.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Testes e DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Xcode 26 is required: actool compiles the Liquid Glass icon (.icon) only from 26 on.
      - name: Selecionar Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache do SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Testes
        run: swift test

      - name: Versão
        id: version
        run: echo "version=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Every release is signed with the same certificate (scripts/release-signing.sh), so macOS
      # keeps the Microphone and Accessibility grants across updates. Without the secrets
      # (pull requests from forks) bundle.sh falls back to ad-hoc signing.
      - name: Importar certificado
        id: signing
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Sem certificado: assinatura ad-hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=Tagara Release" >> "$GITHUB_OUTPUT"

      - name: Gerar DMG
        env:
          IDENTITY: ${{ steps.signing.outputs.identity || 'none' }}
        run: VERSION=${{ steps.version.outputs.version }} scripts/dmg.sh

      - name: Conferir assinatura
        if: steps.signing.outputs.identity != ''
        run: |
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" -quiet
          codesign -dvv "$RUNNER_TEMP/dmg/Tagara.app" 2>&1 | grep "Authority=Tagara Release"
          codesign -d -r- "$RUNNER_TEMP/dmg/Tagara.app" 2>&1 | grep "certificate leaf"
          hdiutil detach "$RUNNER_TEMP/dmg" -quiet

      - name: Guardar DMG do build
        uses: actions/upload-artifact@v4
        with:
          name: Tagara-${{ steps.version.outputs.version }}
          path: dist/*.dmg

      - name: Publicar release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/*.dmg \
            --title "Tagara ${{ steps.version.outputs.version }}" \
            --notes "Instale ou atualize pelo Terminal: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/get.sh | bash\` (ou baixe o \`.dmg\` abaixo; veja o [README](https://github.com/${{ github.repository }}#instalação))." \
            --generate-notes
